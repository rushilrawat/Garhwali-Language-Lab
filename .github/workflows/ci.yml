name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - run: python -m pip install -r requirements-pipeline.txt
      - run: PYTHONPATH=scripts python -m unittest discover -s tests -p 'test_*.py'
      - run: python -m py_compile examples/train_text_mlm.py examples/text_training_utils.py
      - run: python examples/train_text_mlm.py --help
      - name: Check Kaggle notebook syntax
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          notebook = json.loads(Path("notebooks/garhwali_asr_reference_kaggle.ipynb").read_text(encoding="utf-8"))
          for index, cell in enumerate(notebook["cells"]):
              if cell["cell_type"] == "code":
                  ast.parse("".join(cell["source"]), filename=f"ASR notebook cell {index}")
          PY
      - run: python scripts/validate_release_index.py
      - run: python scripts/build_release_bundle.py --check --snapshot-only
